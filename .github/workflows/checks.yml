name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restaurant_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restaurant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: restaurant_test
      DB_PASSWORD: local_ci_only
      DB_NAME: postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
      # The web apps (apps/*) and shared packages (packages/*): one workspace
      # install at the root, then lint, unit tests and both production builds.
      - run: npm ci
      - run: npm run lint
      - run: npm test --workspaces --if-present
      # A build needs the addresses it will run at; CI builds as one domain.
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_CUSTOMER_WEB_URL: same-origin
